<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#1a1a0e"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#ffe033" stroke-width="4" opacity="0.3"/>
  <circle cx="64" cy="64" r="44" fill="rgba(255,224,51,0.05)"/>
  <!-- Hourglass top -->
  <polygon points="36,22 92,22 76,52 52,52" fill="#ffe033" opacity="0.9"/>
  <!-- Hourglass bottom -->
  <polygon points="52,76 76,76 92,106 36,106" fill="#ffe033" opacity="0.6"/>
  <!-- Hourglass waist -->
  <rect x="52" y="52" width="24" height="24" rx="2" fill="none" stroke="#ffe033" stroke-width="2" opacity="0.4"/>
  <!-- Sand top (upper half, half filled) -->
  <polygon points="40,28 88,28 76,52 52,52" fill="#ffd000" opacity="0.3"/>
  <!-- Sand bottom (lower half, falling) -->
